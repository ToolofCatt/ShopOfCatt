# Toàn bộ stack: PostgreSQL + API (NestJS) + Web (Next.js).
# Chạy:  cp .env.docker.example .env  &&  docker compose up -d --build
# Xem thêm mục "Triển khai bằng Docker" trong README.md

name: webcatt

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:17-alpine
    container_name: webcatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD - dat mat khau manh trong .env}"
      POSTGRES_DB: "${POSTGRES_DB:-webcatt}"
      # Ép UTF-8 để lưu tiếng Việt chuẩn
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # CHỈ mở ra localhost. Docker tự ghi luật DNAT vượt qua ufw/firewalld, nên
    # "0.0.0.0:5433" là công khai CSDL ra Internet dù tường lửa đang bật.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - webcatt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webcatt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Một truy vấn chạy loạn không được kéo sập cả máy chủ.
    mem_limit: "${POSTGRES_MEM_LIMIT:-1g}"
    shm_size: "256m"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: webcatt-api:latest
    container_name: webcatt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Mật khẩu nằm giữa chuỗi kết nối nên PHẢI chỉ gồm chữ và số — xem ghi chú
      # ở POSTGRES_PASSWORD trong .env.docker.example.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webcatt}?schema=public"
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:?Thieu JWT_SECRET - hay tao file .env tu .env.docker.example}"
      WEB_URL: "${WEB_URL:-http://localhost:3000}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:3001}"
      # Fail-closed: chỉ bật cổng giả lập khi ghi ĐÚNG "true".
      PAYMENT_MOCK: "${PAYMENT_MOCK:-false}"
      # Binance Pay (merchant) — dùng cho phương thức binance_pay
      BINANCE_PAY_BASE_URL: "${BINANCE_PAY_BASE_URL:-https://bpay.binanceapi.com}"
      BINANCE_PAY_API_KEY: "${BINANCE_PAY_API_KEY:-}"
      BINANCE_PAY_API_SECRET: "${BINANCE_PAY_API_SECRET:-}"
      # Binance tài khoản thường (khóa CHỈ-ĐỌC) — dùng để tự khớp nạp USDT
      # on-chain. Thiếu ba biến này thì BEP20/TRC20 không bao giờ đối soát được.
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_SECRET_KEY: "${BINANCE_SECRET_KEY:-}"
      BINANCE_API_BASE_URL: "${BINANCE_API_BASE_URL:-https://api.binance.com}"
      ORDER_EXPIRE_MINUTES: "${ORDER_EXPIRE_MINUTES:-30}"
      # Múi giờ VN — nếu để mặc định (UTC) thì đơn 00:00–07:00 bị tính sang hôm trước
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      # Tự động dịch sản phẩm sang EN/ZH (để trống = tắt)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Không có mật khẩu mặc định — seed dừng lại nếu thiếu.
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Thieu ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Thieu ADMIN_PASSWORD}"
      # true = chạy seed khi khởi động (idempotent) — chỉ bảo đảm có tài khoản chủ shop.
      SEED_ON_START: "${SEED_ON_START:-true}"
      # true = tạo thêm sản phẩm/khách/thông báo MẪU. Cửa hàng thật để false.
      SEED_DEMO: "${SEED_DEMO:-false}"
    # Mặc định CHỈ nghe trên localhost — người ngoài vào qua proxy HTTPS. Publish
    # 0.0.0.0 là để lộ API dạng HTTP không mã hoá, và Docker tự ghi luật DNAT
    # vượt qua ufw nên tường lửa cũng không chặn được.
    ports:
      - "${APP_BIND:-127.0.0.1}:${API_PORT:-3001}:3001"
    mem_limit: "${API_MEM_LIMIT:-768m}"
    # Cho Nest kịp đóng kết nối Prisma khi redeploy thay vì cắt ngang request.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ------------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* được nhúng vào bundle lúc build → đổi thì phải build lại
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
        NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Catt Store}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    image: webcatt-web:latest
    container_name: webcatt-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server component gọi API qua mạng nội bộ của Docker
      API_URL: "http://api:3001/api"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
      NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Catt Store}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    ports:
      - "${APP_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    mem_limit: "${WEB_MEM_LIMIT:-512m}"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ------------------------------------------------------------- sao lưu
  # Mỗi dòng kho LÀ một sản phẩm — mất CSDL là mất hàng hoá, không dựng lại được.
  # Dịch vụ này chạy pg_dump định kỳ vào thư mục ./backups trên máy chủ.
  # Khôi phục:  ./docker/restore.sh backups/webcatt-YYYYMMDD-HHMMSS.sql.gz
  backup:
    image: postgres:17-alpine
    container_name: webcatt-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD}"
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-webcatt}"
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-86400}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --------------------------------------------- reverse proxy + HTTPS
  # ĐƯỜNG VÀO DUY NHẤT từ Internet. Gộp web + api về CÙNG một tên miền
  # (/ → web, /api → api) và tự xin + tự gia hạn chứng chỉ Let's Encrypt.
  #
  # Chạy luôn cùng stack, KHÔNG phải tuỳ chọn: web/api chỉ nghe trên localhost
  # nên nếu không có proxy thì bên ngoài không vào được gì cả.
  #
  # Đặt trong .env:
  #   SITE_DOMAIN=shop.cua-ban.com   (đã trỏ A/AAAA về máy chủ này)
  #   ACME_EMAIL=ban@vidu.com
  #   NEXT_PUBLIC_API_URL=/api       (rồi build lại web)
  proxy:
    image: caddy:2-alpine
    container_name: webcatt-proxy
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-localhost}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ phải sống qua các lần dựng lại container, nếu không mỗi lần
      # deploy lại xin mới và đụng hạn mức của Let's Encrypt.
      - webcatt_caddy_data:/data
      - webcatt_caddy_config:/config
    # Let's Encrypt xác thực qua đúng cổng 80/443 — chỉ đổi khi chạy thử trong
    # máy và hai cổng này đã bị chiếm.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  webcatt_pgdata:
  webcatt_caddy_data:
  webcatt_caddy_config:
