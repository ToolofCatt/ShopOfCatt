# Toàn bộ stack: PostgreSQL + API (NestJS) + Web (Next.js).
# Chạy:  cp .env.docker.example .env  &&  docker compose up -d --build
# Xem thêm mục "Triển khai bằng Docker" trong README.md

name: webcatt

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16-alpine
    container_name: webcatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD - dat mat khau manh trong .env}"
      POSTGRES_DB: "${POSTGRES_DB:-webcatt}"
      # Ép UTF-8 để lưu tiếng Việt chuẩn
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # CHỈ mở ra localhost. Docker tự ghi luật DNAT vượt qua ufw/firewalld, nên
    # "0.0.0.0:5433" là công khai CSDL ra Internet dù tường lửa đang bật.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - webcatt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webcatt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: webcatt-api:latest
    container_name: webcatt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-webcatt}?schema=public"
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:?Thieu JWT_SECRET - hay tao file .env tu .env.docker.example}"
      WEB_URL: "${WEB_URL:-http://localhost:3000}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:3001}"
      # Fail-closed: chỉ bật cổng giả lập khi ghi ĐÚNG "true".
      PAYMENT_MOCK: "${PAYMENT_MOCK:-false}"
      # Binance Pay (merchant) — dùng cho phương thức binance_pay
      BINANCE_PAY_BASE_URL: "${BINANCE_PAY_BASE_URL:-https://bpay.binanceapi.com}"
      BINANCE_PAY_API_KEY: "${BINANCE_PAY_API_KEY:-}"
      BINANCE_PAY_API_SECRET: "${BINANCE_PAY_API_SECRET:-}"
      # Binance tài khoản thường (khóa CHỈ-ĐỌC) — dùng để tự khớp nạp USDT
      # on-chain. Thiếu ba biến này thì BEP20/TRC20 không bao giờ đối soát được.
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_SECRET_KEY: "${BINANCE_SECRET_KEY:-}"
      BINANCE_API_BASE_URL: "${BINANCE_API_BASE_URL:-https://api.binance.com}"
      ORDER_EXPIRE_MINUTES: "${ORDER_EXPIRE_MINUTES:-30}"
      # Múi giờ VN — nếu để mặc định (UTC) thì đơn 00:00–07:00 bị tính sang hôm trước
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      # Tự động dịch sản phẩm sang EN/ZH (để trống = tắt)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Không có mật khẩu mặc định — seed dừng lại nếu thiếu.
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Thieu ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Thieu ADMIN_PASSWORD}"
      # true = chạy seed khi khởi động (idempotent) — chỉ bảo đảm có tài khoản chủ shop.
      SEED_ON_START: "${SEED_ON_START:-true}"
      # true = tạo thêm sản phẩm/khách/thông báo MẪU. Cửa hàng thật để false.
      SEED_DEMO: "${SEED_DEMO:-false}"
    ports:
      - "${API_PORT:-3001}:3001"

  # ------------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* được nhúng vào bundle lúc build → đổi thì phải build lại
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
        NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Catt Store}"
    image: webcatt-web:latest
    container_name: webcatt-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server component gọi API qua mạng nội bộ của Docker
      API_URL: "http://api:3001/api"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}"
      NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Catt Store}"
    ports:
      - "${WEB_PORT:-3000}:3000"

  # ------------------------------------------------------------- sao lưu
  # Mỗi dòng kho LÀ một sản phẩm — mất CSDL là mất hàng hoá, không dựng lại được.
  # Dịch vụ này chạy pg_dump định kỳ vào thư mục ./backups trên máy chủ.
  # Khôi phục:  ./docker/restore.sh backups/webcatt-YYYYMMDD-HHMMSS.sql.gz
  backup:
    image: postgres:16-alpine
    container_name: webcatt-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD}"
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-webcatt}"
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-86400}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------- reverse proxy (tùy chọn)
  # Gộp web + api về CÙNG một tên miền: / → web, /api → api.
  # Bật bằng:  docker compose --profile proxy up -d --build
  # Trước khi bật, đặt trong .env:  NEXT_PUBLIC_API_URL=/api
  proxy:
    image: nginx:1.27-alpine
    container_name: webcatt-proxy
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - web
      - api
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8080}:80"

volumes:
  webcatt_pgdata:
