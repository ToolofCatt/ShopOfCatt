# Reverse proxy gộp web + api về cùng một origin (bật bằng profile "proxy").
# Nhờ vậy trình duyệt gọi API bằng đường dẫn tương đối /api → không dính CORS.

upstream webcatt_web {
    server web:3000;
}

upstream webcatt_api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    # Cho phép tải file kho hàng .txt lớn / danh sách key dài
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # API (bao gồm cả webhook Binance Pay: /api/payments/binance/webhook)
    location /api/ {
        proxy_pass http://webcatt_api;
    }

    # Toàn bộ phần còn lại là Next.js
    location / {
        proxy_pass http://webcatt_web;
    }
}
